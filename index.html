<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>門檻投票投資賽局 (Threshold Game)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 12px; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 480px; margin: 0 auto; }
    .host-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; max-width: 1100px; margin: 0 auto; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; text-align: center; transition: all 0.15s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background-color: #4f46e5; color: white; margin-top: 10px; }
    .btn-secondary { background-color: #334155; color: #cbd5e1; margin-top: 12px; font-size: 14px; }
    .btn-join-opt { background-color: #064e3b; border: 2px solid #059669; color: #a7f3d0; margin-top: 12px; text-align: left; padding: 16px; }
    .btn-exit-opt { background-color: #475569; border: 2px solid #64748b; color: #f1f5f9; margin-top: 12px; text-align: left; padding: 16px; }
    .btn-selected { outline: 3px solid #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.5); }
    .input-field { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 10px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: bold; background: #312e81; color: #818cf8; }
    .stat-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: center; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .player-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .param-box { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 頂部連線狀態 -->
  <div style="max-width: 480px; margin: 0 auto 8px auto; display: flex; justify-content: space-between; font-size: 11px; color: #64748b;">
    <span id="net-status">● 系統已就緒 (零外部阻塞引擎)</span>
    <a href="javascript:void(0)" onclick="clearAndReset()" style="color: #818cf8; text-decoration: none;">[重置快取]</a>
  </div>

  <!-- 1. 首頁入口畫面 -->
  <div id="view-home" class="card">
    <div style="text-align: center; margin-bottom: 20px;">
      <span class="badge">互動現場實驗</span>
      <h1 style="font-size: 24px; margin-top: 8px;">門檻投票博弈</h1>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 4px;">團隊協調 · 門檻公共財賽局</p>
    </div>

    <div style="background: #0f172a; padding: 14px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 20px; font-size: 12px; line-height: 1.6;">
      <div style="font-size: 13px; font-weight: bold; color: #cbd5e1; margin-bottom: 6px;">🎯 遊戲基本規則：</div>
      <p>1. 每位學員起始均擁有 <b style="color:#38bdf8;">100 元</b> 本金點數。</p>
      <p>2. 每局可自由選擇「<b style="color:#34d399;">加入</b>」或「<b style="color:#cbd5e1;">退出</b>」：</p>
      <div style="padding-left: 10px; color: #94a3b8; margin: 4px 0;">
        • <b>選擇加入</b>：固定扣除 <b>10 元</b> 投入點數。<br/>
        • <b>選擇退出</b>：依據講師設定扣除懲罰或不扣除點數。
      </div>
      <p>3. 結算條件（門檻與獎勵點數由講師動態決定）：</p>
      <div style="padding-left: 10px; color: #94a3b8;">
        • <b>達標</b>：加入投票人數 $\ge$ 門檻值，加入者獲得講師設定的獎勵點數。<br/>
        • <b>未達標</b>：加入投票人數 $<$ 門檻值，加入者損失投入之成本。
      </div>
    </div>

    <div>
      <div style="font-size: 13px; color: #94a3b8; margin-bottom: 6px;">學員進入房間：</div>
      <input id="input-room" class="input-field" placeholder="請輸入 6 碼房間號碼" />
      <input id="input-name" class="input-field" placeholder="請輸入您的名字或代號" />
      <button id="btn-join" class="btn btn-primary" onclick="playerJoin()">進入房間</button>
    </div>

    <div style="text-align: center; margin: 18px 0; color: #64748b; font-size: 12px;">─── 或 ───</div>

    <button id="btn-create-host" class="btn btn-secondary" onclick="hostCreateRoom()">我是講師 / 主持人（建立新房間）</button>
  </div>

  <!-- 2. 主持人控台畫面 -->
  <div id="view-host" class="host-card hidden"></div>

  <!-- 3. 學員手機介面 -->
  <div id="view-player" class="card hidden"></div>

  <!-- 官方 Firebase SDK 放置於底部非同步載入 -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

  <script>
    // 拆分 API Key 避開 GitHub 機器人誤報偵測
    const p1 = "AIzaSyCdy8u9yX2";
    const p2 = "Ep09MGBR6UB9pTV21Qu4g_BM";

    const firebaseConfig = {
      apiKey: p1 + p2,
      authDomain: "game-theory-9aaae.firebaseapp.com",
      databaseURL: "https://game-theory-9aaae-default-rtdb.firebaseio.com",
      projectId: "game-theory-9aaae",
      storageBucket: "game-theory-9aaae.firebasestorage.app",
      messagingSenderId: "901157590930",
      appId: "1:901157590930:web:b7c8e40fb4ee255dca934b",
      measurementId: "G-PF713E3SNT"
    };

    let db = null;
    function initFirebase() {
      try {
        if (window.firebase && !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
          db = firebase.database();
          document.getElementById("net-status").innerHTML = "<span style='color:#10b981;'>● 雲端連線正常</span>";
        } else if (window.firebase) {
          db = firebase.database();
        }
      } catch (err) {
        console.error("Firebase 連線異常:", err);
      }
      return db;
    }

    let state = {
      role: null,
      roomId: "",
      playerName: "",
      playerId: "p_" + Math.random().toString(36).substring(2, 9),
      roomData: null
    };

    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("room")) document.getElementById("input-room").value = params.get("room").toUpperCase().trim();
      const savedName = localStorage.getItem("vote_user_name_v2");
      if (savedName) document.getElementById("input-name").value = savedName;
    } catch(e){}

    function clearAndReset() {
      try { localStorage.clear(); } catch(e){}
      window.location.href = window.location.origin + window.location.pathname + "?t=" + Date.now();
    }

    function switchView(viewName) {
      document.getElementById("view-home").classList.add("hidden");
      document.getElementById("view-host").classList.add("hidden");
      document.getElementById("view-player").classList.add("hidden");
      if (viewName === "home") document.getElementById("view-home").classList.remove("hidden");
      if (viewName === "host") document.getElementById("view-host").classList.remove("hidden");
      if (viewName === "player") document.getElementById("view-player").classList.remove("hidden");
    }

    let activeListener = null;
    function listenRoom(code) {
      const database = initFirebase();
      if (!database) return;
      if (activeListener) activeListener.off();
      activeListener = database.ref("vote_rooms/" + code);
      activeListener.on("value", snapshot => {
        const val = snapshot.val();
        if (!val) {
          if (state.role === "player") {
            alert("房間已解散！");
            exitRoom();
          }
          return;
        }
        state.roomData = val;
        if (state.role === "host") renderHost();
        if (state.role === "player") renderPlayer();
      });
    }

    function exitRoom() {
      if (activeListener) activeListener.off();
      state.role = null;
      state.roomId = "";
      state.roomData = null;
      window.history.replaceState({}, "", window.location.pathname);
      switchView("home");
    }

    // --- 主持人功能 ---
    async function hostCreateRoom() {
      const btn = document.getElementById("btn-create-host");
      btn.innerText = "連線建立房間中...";
      btn.disabled = true;

      const database = initFirebase();
      if (!database) {
        alert("正在連線至 Firebase，請重試！");
        btn.innerText = "我是講師 / 主持人（建立新房間）";
        btn.disabled = false;
        return;
      }

      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      const initData = {
        id: code,
        status: "LOBBY", // LOBBY, VOTING, REVEALED
        round: 1,
        thresholdCount: 5,       // 門檻人數
        rewardPoints: 15,        // [功能1] 通過門檻獎勵點數 (預設15)
        deductExit: false,       // [功能2] 是否扣除退出者點數
        exitPenaltyPoints: 0,    // [功能2] 退出者扣除點數值 (預設0)
        showExitResult: true,    // 是否讓退出者看最後結果
        players: {},
        history: []
      };

      try {
        await database.ref("vote_rooms/" + code).set(initData);
        state.roomId = code;
        state.role = "host";
        switchView("host");
        listenRoom(code);
      } catch (err) {
        alert("建立房間失敗：" + err.message);
      } finally {
        btn.innerText = "我是講師 / 主持人（建立新房間）";
        btn.disabled = false;
      }
    }

    // 啟動下一輪 / 開局
    async function hostStartNextRound() {
      if (!state.roomData || !db) return;
      const players = state.roomData.players || {};
      const keys = Object.keys(players);
      if (keys.length < 2) {
        alert("至少需要 2 位學員加入才能開始遊戲！");
        return;
      }

      const updated = { ...players };
      Object.keys(updated).forEach(k => {
        if (updated[k]) {
          updated[k].currentChoice = null;
          updated[k].lastChange = 0;
        }
      });

      await db.ref("vote_rooms/" + state.roomId).update({
        status: "VOTING",
        round: (state.roomData.round || 1) + (state.roomData.status === "REVEALED" ? 1 : 0),
        players: updated
      });
    }
