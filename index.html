<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>門檻投票投資賽局 (Threshold Game)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 12px; }
    .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); max-width: 480px; margin: 0 auto; }
    .host-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px; max-width: 1100px; margin: 0 auto; }
    .btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; text-align: center; transition: all 0.15s; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background-color: #4f46e5; color: white; margin-top: 10px; }
    .btn-secondary { background-color: #334155; color: #cbd5e1; margin-top: 12px; font-size: 14px; }
    .btn-join-opt { background-color: #064e3b; border: 2px solid #059669; color: #a7f3d0; margin-top: 12px; text-align: left; padding: 16px; }
    .btn-exit-opt { background-color: #475569; border: 2px solid #64748b; color: #f1f5f9; margin-top: 12px; text-align: left; padding: 16px; }
    .btn-selected { outline: 3px solid #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.5); }
    .input-field { width: 100%; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 10px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: bold; background: #312e81; color: #818cf8; }
    .stat-box { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; text-align: center; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .player-card { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; }
    .param-box { background: #1e293b; border: 1px solid #475569; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
